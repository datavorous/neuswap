[project]
name = "neural-theatre"
version = "0.1.0"
description = "One frozen MLX model with experimental hot-swappable NPC neuron controls"
requires-python = ">=3.11"
dependencies = ["mlx-lm>=0.32,<0.33", "numpy>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
demo = ["pygame-ce>=2.5,<3"]

[tool.pytest.ini_options]
pythonpath = ["experiments"]
testpaths = ["experiments/tests"]
